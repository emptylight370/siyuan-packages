name: Release

on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "<package>@<version>"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # mise 提供 node（类型剥离需 23.6+，须在运行 .ts 脚本前就绪）
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # 处理 tag，提取包名和版本
      - name: Parse tag
        id: meta
        run: node scripts/parse-tag.ts "${{ inputs.tag || github.ref_name }}"

      # 统一判定是否继续：meta.json 版本与 tag 不一致、或已存在同名 release 时跳过后续全部步骤
      - name: Check whether to release
        id: state
        run: |
          repo="${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.matched }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::跳过发布：${{ steps.meta.outputs.reason }}"
            exit 0
          fi
          if output=$(gh release view "$version" -R "$repo" 2>&1); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$repo $version 已发布，跳过"
          elif echo "$output" | grep -qiE 'release not found|HTTP 404'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::检查 $repo 的 release 失败: $output"
            exit 1
          fi

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # 构建 package.zip
      - name: Build
        if: steps.state.outputs.skip != 'true'
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm --filter "${{ steps.meta.outputs.name }}" build

      # 创建提交日志
      - name: Generate release notes
        if: steps.state.outputs.skip != 'true'
        run: |
          git cliff \
            --config "${{ steps.meta.outputs.dir }}/cliff.toml" \
            --latest \
            -o release.md
          prettier -w release.md

      # 提取打包版本号
      - name: Get packaged version
        if: steps.state.outputs.skip != 'true'
        id: packaged
        uses: emptylight370/jq-action@v1
        with:
          data: ${{ steps.meta.outputs.dir }}/dist/plugin.json
          filter: .version

      # 验证将要发布的版本是否一致
      - name: Verify packaged version
        if: steps.state.outputs.skip != 'true'
        run: |
          if [ "${{ steps.packaged.outputs.result }}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::包内版本 (${{ steps.packaged.outputs.result }}) 与 tag (${{ steps.meta.outputs.version }}) 不一致"
            exit 1
          fi

      # 检查仓库中配置的 RELEASE_TOKEN 是否可用
      - name: Check release token
        if: steps.state.outputs.skip != 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::未配置 secrets.RELEASE_TOKEN，跨仓库发布需要具备目标仓库 contents: write 的 PAT 或 GitHub App token"
            exit 1
          fi

      # 先把少量元数据同步到目标仓库，使之后创建的 tag 指向包含最新元数据的提交
      - name: Sync metadata to target repo
        if: steps.state.outputs.skip != 'true'
        continue-on-error: true
        run: |
          dir="${{ steps.meta.outputs.dir }}"
          git clone --depth=1 "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}.git" target
          cp "$dir/dist/plugin.json" "$dir/dist/icon.png" "$dir/dist/preview.png" target/
          cd target
          git config user.name "${{ vars.COMMIT_NAME }}"
          git config user.email "${{ vars.COMMIT_EMAIL }}"
          # 用 status --porcelain 而非 diff --quiet：后者不统计新增文件
          if [ -z "$(git status --porcelain)" ]; then
            echo "元数据无变化，无需提交"
            exit 0
          fi
          git add plugin.json icon.png preview.png
          git commit -m "chore(version): release ${{ steps.packaged.outputs.result }}"
          git push

      # 在目标仓库发布版本
      - name: Release
        if: steps.state.outputs.skip != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # 跨仓库发布：repository 为 owner/repo，token 必须是能写目标仓库的 PAT
          repository: ${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.packaged.outputs.result }}
          # 仅在目标仓库还没有该 tag 时用于创建 tag
          target_commitish: main
          name: Release ${{ steps.packaged.outputs.result }}
          files: |
            ${{ steps.meta.outputs.dir }}/package.zip
          fail_on_unmatched_files: true
          body_path: release.md
          make_latest: true
