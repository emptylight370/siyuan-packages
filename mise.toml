monorepo_root = true

[monorepo]
config_roots = ["packages/plugin/*", "packages/lib/*"]

[tools]
git-cliff = "latest"
lefthook = "latest"
node = "26"
pnpm = "latest"
prettier = "latest"

[deps.pnpm]

[deps.lefthook]
description = "Install lefthook hooks"
run = "lefthook install"
sources = ["lefthook.yml"]

[settings]
task.auto_infer = ["node"]
